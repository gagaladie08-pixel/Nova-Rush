name: NovaListen Next — publier l’APK 0.3.1

on:
  push:
    branches: [arena/bc2e07e6-nova-rush]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: novalisten-publish-031
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-031]') }}
    name: Récupérer l’APK compilé/signé, vérifier, publier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: '45456867918'
      TAG: novalisten-next-v0.3.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: build-tools;35.0.0
      - name: Récupérer l’artefact du run de compilation (aucune recompilation)
        run: |
          gh run download "$BUILD_RUN" --name NovaListen-Next-0.3.1 --dir dist
          ls -l dist
      - name: Vérifier la clé, la signature réelle et la somme du fichier
        run: |
          python3 scripts/signing_policy.py verify-keystore
          python3 scripts/signing_policy.py verify-apk dist/NovaListen-Next-0.3.1.apk
          cd dist && sha256sum NovaListen-Next-0.3.1.apk | tee SHA256SUMS.txt
      - name: Publier la version GitHub (lien direct pour le téléphone)
        run: |
          notes=$(printf '%s\n' \
            'Premier APK **0.3.1** compilé et publié avec la clé de livraison unique.' \
            '' \
            '- Contient les huit corrections de 0.3.1.' \
            '- Signé avec `c38a837ee566ad95000af71cb13497e3d330ebcde5c6c8fcc4880265a77c68ad`.' \
            '- **Réinstallation nécessaire** depuis 0.2.3 / Next 0.3.0 : désinstaller `com.novalisten.app.next`, pas `com.novalisten.app`.' \
            '- Les fichiers audio ne sont pas touchés ; favoris, playlists, paroles enregistrées et réglages de Next sont perdus à la désinstallation.' \
            '- Les versions suivantes s’installeront par-dessus celle-ci.')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/NovaListen-Next-0.3.1.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/NovaListen-Next-0.3.1.apk dist/SHA256SUMS.txt \
              --title "NovaListen Next 0.3.1 — clé unique, mise à jour rétablie" \
              --notes "$notes" --prerelease
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | "::notice title=APK 0.3.1::" + .name + " " + .browser_download_url'
      - name: Récupération sans asset — dossier API horodaté
        # Release assets and run artifacts both go through hosts blocked from the
        # workspace. The Git Data API is reachable: store the bytes in a directory
        # named after the file's SHA-256, then verify after download.
        run: |
          sha=$(sha256sum dist/NovaListen-Next-0.3.1.apk | cut -d' ' -f1)
          mkdir -p "apk-livraison/$sha"
          cp dist/NovaListen-Next-0.3.1.apk "apk-livraison/$sha/"
          echo "{\"file\":\"NovaListen-Next-0.3.1.apk\",\"bytes\":$(stat -c%s dist/NovaListen-Next-0.3.1.apk),\"sha256\":\"$sha\",\"signature_verified\":true,\"build_run\":$BUILD_RUN}" > "apk-livraison/$sha/manifeste.json"
          git config user.name "NovaListen delivery"
          git config user.email "actions@users.noreply.github.com"
          git add "apk-livraison/$sha"
          git commit -m "delivery: signed NovaListen Next 0.3.1 ($sha)"
          git push
          echo "::notice title=APK 0.3.1 récupérable::apk-livraison/$sha/NovaListen-Next-0.3.1.apk"

      - name: Tester la récupération par l’API (même chemin que le poste de travail)
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          sha = hashlib.sha256(Path('dist/NovaListen-Next-0.3.1.apk').read_bytes()).hexdigest()
          base = f'apk-livraison/{sha}'
          body = subprocess.check_output(['gh', 'api', f'repos/{repo}/contents/{base}/NovaListen-Next-0.3.1.apk?ref=main'],
                                         stderr=subprocess.DEVNULL)
          encoded = ''.join(json.loads(body)['content'].split())
          data = base64.b64decode(encoded)
          assert hashlib.sha256(data).hexdigest() == sha, 'récupération API divergente'
          assert len(data) == Path('dist/NovaListen-Next-0.3.1.apk').stat().st_size
          print('::notice title=Récupération API vérifiée::' + sha + ' ' + str(len(data)) + ' octets')
          PY
