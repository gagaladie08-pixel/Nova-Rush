name: NovaListen Next — publier l’APK 0.4.0

on:
  push:
    branches: [arena/bc2e07e6-nova-rush]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: novalisten-publish-040
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-040]') }}
    name: Récupérer l’APK compilé/signé, vérifier, publier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: '45486704883'
      TAG: novalisten-next-v0.4.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: build-tools;35.0.0
      - name: Récupérer l’artefact du run de compilation (aucune recompilation)
        run: |
          gh run download "$BUILD_RUN" --name NovaListen-Next-0.4.0 --dir dist
          ls -l dist
      - name: Vérifier la clé, la signature réelle et la somme du fichier
        run: |
          python3 scripts/signing_policy.py verify-keystore
          python3 scripts/signing_policy.py verify-apk dist/NovaListen-Next-0.4.0.apk
          cd dist && sha256sum NovaListen-Next-0.4.0.apk | tee SHA256SUMS.txt
      - name: Publier la version GitHub (lien direct pour le téléphone)
        run: |
          notes=$(printf '%s\n' \
            '**0.4.0 — les quinze univers transforment vraiment l’application.**' \
            '' \
            '- Icônes dessinées famille par famille, deux polices par univers, trois niveaux de formes, décors et pochettes ornementées.' \
            '- Barre de progression du player plein écran : trait, halo, remplissage et dévoilement propres à chaque univers.' \
            '- Transitions d’écran unifiées, durées et courbes du catalogue, respect de la réduction d’animations.' \
            '- Palettes fournies conservées ; seuls Pink Y2K et Cloud Nine ont leurs textes secondaires éclaircis pour rester lisibles.' \
            '- Même clé et même `com.novalisten.app.next` : **installation par-dessus 0.3.1**, sans désinstallation.' \
            '- Signature `c38a837ee566ad95000af71cb13497e3d330ebcde5c6c8fcc4880265a77c68ad`.')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/NovaListen-Next-0.4.0.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/NovaListen-Next-0.4.0.apk dist/SHA256SUMS.txt \
              --title "NovaListen Next 0.4.0 — quinze univers complets" \
              --notes "$notes" --prerelease
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | "::notice title=APK 0.4.0::" + .name + " " + .browser_download_url'
      - name: Récupération sans asset — dossier API horodaté
        # Release assets and run artifacts both go through hosts blocked from the
        # workspace. The Git Data API is reachable: store the bytes in a directory
        # named after the file's SHA-256, then verify after download.
        run: |
          sha=$(sha256sum dist/NovaListen-Next-0.4.0.apk | cut -d' ' -f1)
          export SHA=$sha
          python3 scripts/record_delivery.py dist/NovaListen-Next-0.4.0.apk \
            --version-code 8 --version-name 0.4.0
          git config user.name "NovaListen delivery"
          git config user.email "actions@users.noreply.github.com"
          git add -f "apk-livraison/$sha/NovaListen-Next-0.4.0.apk" "apk-livraison/$sha/manifeste.json"
          git status --short "apk-livraison/$sha"
          git commit -m "delivery: signed NovaListen Next 0.4.0 ($sha)"
          git push
          echo "::notice title=APK 0.4.0 récupérable::apk-livraison/$sha/NovaListen-Next-0.4.0.apk"

      - name: Tester la récupération par l’API (même chemin que le poste de travail)
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          sha = hashlib.sha256(Path('dist/NovaListen-Next-0.4.0.apk').read_bytes()).hexdigest()
          base = f'apk-livraison/{sha}'
          body = subprocess.check_output(['gh', 'api', f'repos/{repo}/contents/{base}/NovaListen-Next-0.4.0.apk?ref=${{ github.ref_name }}'],
                                         stderr=subprocess.DEVNULL)
          encoded = ''.join(json.loads(body)['content'].split())
          data = base64.b64decode(encoded)
          assert hashlib.sha256(data).hexdigest() == sha, 'récupération API divergente'
          assert len(data) == Path('dist/NovaListen-Next-0.4.0.apk').stat().st_size
          print('::notice title=Récupération API vérifiée::' + sha + ' ' + str(len(data)) + ' octets')
          PY
