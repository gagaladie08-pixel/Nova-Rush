name: NovaListen — APK et tests

on:
  push:
    branches: [arena/216bd0ac-nova-rush]
    paths-ignore: ['docs/**', '**.md', 'Conception_Nova_Rush.docx']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novalisten-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compiler, vérifier et tester Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Intégrité des spécifications embarquées
        run: python3 scripts/verify-project.py
      - name: Tests unitaires, lint et APK de test signé
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Préparer les livrables
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/NovaListen-0.1.0-debug.apk
          cd artifacts
          sha256sum NovaListen-0.1.0-debug.apk > SHA256SUMS.txt
      - name: Publier l’APK installable
        uses: actions/upload-artifact@v4
        with:
          name: NovaListen-0.1.0-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Activer KVM pour les tests sur émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests d’installation et de navigation (Android 10)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Publier les rapports de vérification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaListen-verifications
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14
