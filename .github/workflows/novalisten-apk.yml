name: NovaListen — APK et tests

on:
  push:
    branches: [arena/216bd0ac-nova-rush]
    paths-ignore: ['docs/**', '**.md', 'Conception_Nova_Rush.docx']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novalisten-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Publishing an already verified binary must not rebuild it with a new debug key.
    if: ${{ !contains(github.event.head_commit.message, '[publish-apk]') }}
    name: Compiler, vérifier et tester Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false
      - name: Intégrité des spécifications embarquées
        run: python3 scripts/verify-project.py
      - name: Tests unitaires, lint et APK de test signé
        run: scripts/gradle-ci.sh testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Préparer les livrables
        id: apk
        run: |
          version="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/NovaListen-$version-debug.apk"
          cd artifacts
          sha256sum "NovaListen-$version-debug.apk" > SHA256SUMS.txt
      - name: Publier l’APK installable
        uses: actions/upload-artifact@v7
        with:
          name: NovaListen-${{ steps.apk.outputs.version }}-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Activer KVM pour les tests sur émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests d’installation et de navigation (Android 10)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: scripts/gradle-ci.sh connectedDebugAndroidTest
      - name: Publier les rapports de vérification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NovaListen-verifications
          path: |
            artifacts/diagnostics/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14
      - name: Pont de livraison limité aux fichiers compilés
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github-transfer.py
