name: NovaListen — APK et tests

on:
  push:
    branches: [arena/216bd0ac-nova-rush, arena/bc2e07e6-nova-rush]
    paths-ignore: ['docs/**', '**.md', 'Conception_Nova_Rush.docx']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novalisten-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Source-only checks and publication of an existing binary never start the APK chain.
    if: >-
      !contains(github.event.head_commit.message, '[publish-apk]') &&
      !contains(github.event.head_commit.message, '[sources-only]')
    name: Compiler, vérifier et tester Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Vérifier la clé de livraison épinglée (commitée, jamais générée)
        run: |
          python3 -m unittest discover -s scripts -p 'test_signing_policy.py' -v
          python3 scripts/signing_policy.py verify-keystore
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false
      - name: Intégrité des spécifications embarquées
        run: python3 scripts/verify-project.py
      - name: Refuser toute version qui casserait la mise à jour
        # Clé, applicationId, certificat et versionCode comparés à la version déjà livrée.
        run: python3 scripts/check_update_continuity.py
      - name: Tests unitaires, lint et APK de test signé
        run: scripts/gradle-ci.sh testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Vérifier la signature réelle avant toute livraison
        run: python3 scripts/signing_policy.py verify-apk app/build/outputs/apk/debug/app-debug.apk
      - name: Préparer les livrables
        id: apk
        run: |
          version="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/NovaListen-Next-$version.apk"
          cd artifacts
          sha256sum "NovaListen-Next-$version.apk" > SHA256SUMS.txt
      - name: Publier l’APK installable
        uses: actions/upload-artifact@v7
        with:
          name: NovaListen-Next-${{ steps.apk.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Activer KVM pour les tests sur émulateur
        if: ${{ vars.NOVALISTEN_DEVICE_TESTS == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests d’installation et de navigation (Android 10)
        if: ${{ vars.NOVALISTEN_DEVICE_TESTS == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: scripts/test-android-device.sh
      - name: Tests réels de fenêtre et de persistance (Android 15, gestes puis trois boutons)
        if: ${{ vars.NOVALISTEN_DEVICE_TESTS == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: novalisten-api35
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: scripts/test-android-device.sh navigation
      - name: Publier les rapports de vérification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NovaListen-verifications
          path: |
            artifacts/diagnostics/
            artifacts/device-verifications/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14
