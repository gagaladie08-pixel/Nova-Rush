name: APK Android

on:
  push:
    branches: ['main', 'arena/**']
    paths-ignore: ['tools/**', '.github/workflows/separation-eval.yml', '.github/workflows/ai-models.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et compilation de l'APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
      SEP_MODEL: UVR_MDXNET_1_9703.onnx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Dépendances
        run: npm ci

      - name: Tests (règles de score, analyse musicale)
        run: npm test

      - name: Build web
        run: npm run build

      - name: Synchronisation Capacitor
        run: npx cap sync android

      # Modèles d'IA open source embarqués dans l'APK (l'analyse se fait
      # entièrement sur le téléphone), convertis et vérifiés par ai-models.yml :
      # - voix : UVR-MDX (Apache 2.0, via sherpa-onnx), poids en float16 ;
      # - temps et mesures : Beat This! « final » (MIT), poids int8 ;
      # - hauteur de la voix : CREPE « tiny » (MIT, via onnxcrepe).
      - name: Modèles d'IA
        run: |
          set -e
          A=android/app/src/main/assets
          R=https://github.com/${{ github.repository }}/releases/download/ai-models-v1
          mkdir -p $A/separation $A/ai
          curl -fsSL --retry 3 -o $A/separation/model.onnx $R/uvr_1_9703.onnx
          curl -fsSL --retry 3 -o $A/ai/beat_this.onnx $R/beat_this_final0.int8.onnx
          curl -fsSL --retry 3 -o $A/ai/crepe.onnx $R/crepe_tiny.onnx
          curl -fsSL --retry 3 -o /tmp/SHA256SUMS $R/SHA256SUMS
          (cd /tmp && grep -E ' (uvr_1_9703|beat_this_final0.int8|crepe_tiny).onnx$' SHA256SUMS > want.txt)
          echo "$(awk '/uvr_1_9703/{print $1}' /tmp/want.txt)  $A/separation/model.onnx" | sha256sum -c
          echo "$(awk '/beat_this_final0.int8/{print $1}' /tmp/want.txt)  $A/ai/beat_this.onnx" | sha256sum -c
          echo "$(awk '/crepe_tiny/{print $1}' /tmp/want.txt)  $A/ai/crepe.onnx" | sha256sum -c
          ls -la $A/separation $A/ai

      - name: Tests Java (FFT, STFT, découpage, rééchantillonnage)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Compilation de l'APK (release signé)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renommage
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/NovaRush-${APP_VERSION}.apk"
          ls -la out

      - name: Artefact
        uses: actions/upload-artifact@v7
        with:
          name: NovaRush-${{ env.APP_VERSION }}
          path: out/*.apk
          retention-days: 30

      - name: Publication (release GitHub)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ env.APP_VERSION }}
          name: Nova Rush ${{ env.APP_VERSION }} (APK de test)
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          files: out/*.apk
          body: |
            APK Android de test de Nova Rush, compilé automatiquement depuis `${{ github.ref_name }}` (${{ github.sha }}).

            **Installation** : télécharge `NovaRush-${{ env.APP_VERSION }}.apk` sur ton téléphone Android, ouvre-le et autorise l'installation depuis cette source si Android le demande.

            Signé avec la clé de test du dépôt : les versions suivantes s'installent par-dessus sans désinstaller.
