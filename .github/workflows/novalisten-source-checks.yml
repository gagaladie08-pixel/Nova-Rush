name: NovaListen — Vérification des sources sans APK

on:
  push:
    branches: [arena/216bd0ac-nova-rush, arena/bc2e07e6-nova-rush]
    paths: ['app/**', 'scripts/**', 'config/**', '*.kts', 'gradle/**', '.github/workflows/novalisten-source-checks.yml']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: novalisten-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: Sources Next, tests JVM/rendu et lint — aucune signature ni APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NOVALISTEN_VERIFY_SOURCES: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false
      - name: Intégrité et garde-fous de signature
        run: |
          python3 scripts/verify-project.py
          python3 -m unittest discover -s scripts -p 'test_*signing*.py' -v
      - name: Vérifier que le mode sources refuse réellement de produire un APK
        run: >-
          python3 scripts/expect-gradle-refusal.py --label source-only
          --message 'génération d’APK/AAB et signature interdites'
          -- ./gradlew --no-daemon --console=plain assembleDebug
      - name: Confirmer que la clé de livraison est réellement versionnée
        # A re-added *.p12 / *.jks ignore rule would silently drop the key from Git and
        # bring back the 0.2.x update failures. The build gate then fails closed.
        run: |
          test -f config/signing/NovaListen-release.p12
          test -f config/signing/signing-password.txt
          git ls-files --error-unmatch config/signing/NovaListen-release.p12
          git ls-files --error-unmatch config/signing/signing-password.txt
          if git check-ignore -q config/signing/NovaListen-release.p12; then
            echo '::error::La clé de livraison est ignorée par Git.'
            exit 1
          fi
          python3 scripts/signing_policy.py verify-keystore
      - name: Compiler les sources et les tests Android, tester le domaine, analyser lint
        run: scripts/gradle-ci.sh testDebugUnitTest compileDebugAndroidTestKotlin lintDebug
      - name: Confirmer l’absence de binaire installable
        if: always()
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            echo '::error::Une clé debug implicite a été créée pendant les vérifications.'
            exit 1
          fi
          if find app/build artifacts -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.keystore' -o -name '*.jks' \) -print -quit 2>/dev/null | grep -q .; then
            echo '::error::Un binaire ou une clé inattendus ont été générés en mode sources seules.'
            exit 1
          fi
      - name: Échecs de test en annotations lisibles
        # Le stockage des journaux de GitHub est parfois inaccessible depuis l'atelier.
        # Cette étape publie le nom du test et son message en annotation : le diagnostic
        # reste disponible même quand le log complet ne l'est pas.
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          found = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              try: root = ET.parse(path).getroot()
              except Exception: continue
              for case in root.iter('testcase'):
                  for failure in case.findall('failure'):
                      found += 1
                      name = f"{case.get('classname','')}.{case.get('name','')}"
                      detail = (failure.get('message') or failure.text or '').strip().splitlines()
                      message = ' | '.join(line.strip() for line in detail[:4])[:600]
                      message = message.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title=Test en échec::{name} :: {message}")
          print(f'{found} test(s) en échec')
          PY
      - name: Rapports seulement — aucun APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NovaListen-source-verifications
          path: |
            artifacts/diagnostics/
            app/build/reports/
            app/build/test-results/
          retention-days: 14
      - name: Pont limité aux journaux et rapports
        # Le pont ne sert qu'à rendre les rapports lisibles depuis l'atelier. Une panne de
        # l'API GitHub (503 constaté) ne doit pas faire échouer une vérification réussie :
        # les tests ont déjà tranché, et les rapports restent dans l'artefact.
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github-transfer.py
