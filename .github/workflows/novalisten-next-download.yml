name: NovaListen Next — lien de téléchargement 0.3.0

on:
  push:
    branches: [arena/216bd0ac-nova-rush]
    paths: ['.github/workflows/novalisten-next-download.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: novalisten-next-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-verified-apk:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-next]') }}
    name: Publier exactement l’APK Next signé et testé, sans recompilation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: novalisten-next-v0.3.0
      RELEASE_ID: '453994235'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: build-tools;35.0.0
      - name: Télécharger uniquement le binaire public déjà signé
        run: |
          test ! -e private-signing
          python3 scripts/parallel_install_smoke.py fetch
      - name: Vérifier les preuves, le manifeste, l’alignement et le certificat Next
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'scripts')
          from parallel_signing import verify_apk
          from prepare_parallel_build import badging

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/{path}']))

          info = json.loads(Path('config/next-apk-under-test.json').read_text())
          source = 'b65348dc73075eb2a21b74cdcfe319b769175e8b'
          sha = '3a15fc41a8beffcb02c262b6759867df6c4113262f3812a99811fce6f01c52ec'
          cert = '64dd5e7487e743a4af30a8a7c7f045251e54730d01009295783d98ace87fde17'
          filename = 'NovaListen-Next-0.3.0-debug.apk'
          assert (info['source_commit'], info['file'], info['bytes'], info['sha256'], info['certificate_sha256']) == (source, filename, 89793676, sha, cert)
          build = api('actions/runs/44949752140')
          assert build['status'] == 'completed' and build['conclusion'] == 'success' and build['head_sha'] == source
          smoke = api('actions/runs/44950357575')
          assert smoke['status'] == 'completed' and smoke['conclusion'] == 'success' and smoke['head_sha'] == 'ffbc43671ae710c9efcbc5d7bb05067eb9089339'
          jobs = api('actions/runs/44950357575/jobs?per_page=100')['jobs']
          assert {job['id'] for job in jobs if job['conclusion'] == 'success'} == {136986697682, 136986698030}
          # Drafts may not yet resolve by tag; pin the existing draft ID as well.
          release = api('releases/' + os.environ['RELEASE_ID'])
          assert release['tag_name'] == 'novalisten-next-v0.3.0' and release['target_commitish'] == source
          assert release['draft'] is True and release['prerelease'] is True and release['assets'] == []
          apk = Path('.cache/next-device-check') / filename
          assert apk.stat().st_size == 89793676 and hashlib.sha256(apk.read_bytes()).hexdigest() == sha
          sdk = Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT']) / 'build-tools/35.0.0'
          assert verify_apk(apk, sdk / 'lib/apksigner.jar')['certificate_sha256'] == cert
          binary = badging(subprocess.check_output([str(sdk / 'aapt2'), 'dump', 'badging', str(apk)], text=True))
          assert binary == {'application_id': 'com.novalisten.app.next', 'version_code': 6, 'version_name': '0.3.0', 'label': 'NovaListen Next', 'min_sdk': 26}
          subprocess.run([str(sdk / 'zipalign'), '-c', '-P', '16', '4', str(apk)], check=True)
          (apk.parent / 'SHA256SUMS.txt').write_text(sha + '  ' + filename + '\n')
          print('APK signé/testé inchangé ; aucune compilation, signature ou clé privée en CI.')
          PY
      - name: Envoyer seulement l’APK public signé et sa somme, sans écrasement
        run: >-
          gh release upload "$RELEASE_TAG"
          .cache/next-device-check/NovaListen-Next-0.3.0-debug.apk
          .cache/next-device-check/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
      - name: Vérifier les fichiers hébergés avant publication
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/{os.environ["RELEASE_ID"]}']))
          assert release['tag_name'] == 'novalisten-next-v0.3.0' and release['draft'] is True and release['prerelease'] is True
          assert release['target_commitish'] == 'b65348dc73075eb2a21b74cdcfe319b769175e8b'
          assets = {asset['name']: asset for asset in release['assets']}
          assert len(release['assets']) == 2 and set(assets) == {'NovaListen-Next-0.3.0-debug.apk', 'SHA256SUMS.txt'}
          for name, asset in assets.items():
              local = Path('.cache/next-device-check') / name
              assert asset['state'] == 'uploaded' and asset['size'] == local.stat().st_size
              assert asset['digest'] == 'sha256:' + hashlib.sha256(local.read_bytes()).hexdigest()
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "NovaListen-Next-0.3.0-debug.apk") | "::notice title=Lien direct APK Next::" + .browser_download_url'
